[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blockchain-certificates"
version = "1.0.0"
description = "Blockchain-based Certificate Verification System"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mani", email = "myfamily9006@gmail.com"}
]
keywords = ["blockchain", "certificates", "verification", "cryptography", "distributed"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
cert-chain = "src.cli:main"

[project.urls]
Homepage = "https://github.com/blockchain-certs/blockchain-certificates"
Repository = "https://github.com/blockchain-certs/blockchain-certificates"
Documentation = "https://github.com/blockchain-certs/blockchain-certificates/blob/main/docs/architecture.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 80
